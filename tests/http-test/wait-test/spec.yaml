description: "Wait polling — background readiness then cat with wait"
steps:
  - type: exec
    command: "rm -f /tmp/ready; (sleep 3 && echo ready > /tmp/ready) &"
  - type: exec
    command: "cat /tmp/ready"
    wait:
      timeout: "30s"
      delay: "2s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "ready" }
