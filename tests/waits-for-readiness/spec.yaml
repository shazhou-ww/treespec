description: "waits for background process to become ready"
steps:
  - type: exec
    command: "treespec run --config /app/tests/waits-for-readiness/assets/wait-fixture/treespec.yaml --image treespec-fixture:base --no-mount --no-trace --keep-tags 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 passed" }
        - { path: "exit_code", regex: "^0$" }
