description: "runs a subset of the test tree by path"
steps:
  - type: exec
    command: "treespec run --config /specs/runs-subset/assets/subset-fixture/treespec.yaml beta --image treespec-fixture:base --no-mount --no-trace --keep-tags 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 passed" }
        - { path: "stdout", regex: "beta" }
        - { path: "exit_code", regex: "^0$" }
