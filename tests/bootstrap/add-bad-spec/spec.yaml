description: "add a spec with invalid assertion type"
steps:
  - type: exec
    command: "mkdir -p /tmp/bootstrap-project/tests/broken-spec && cat > /tmp/bootstrap-project/tests/broken-spec/spec.yaml << 'SPEC'\ndescription: \"broken spec with invalid assert\"\nsteps:\n  - type: exec\n    command: \"echo hi\"\n    assert:\n      type: nonexistent\n      conditions:\n        - { path: \"stdout\", regex: \"hi\" }\nSPEC"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
