description: "shows test tree structure with tree command"
steps:
  - type: exec
    command: "treespec tree --config assets/tree-fixture/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "base image" }
        - { path: "stdout", regex: "alpha" }
        - { path: "stdout", regex: 'group \[org\]' }
        - { path: "stdout", regex: "beta" }
        - { path: "exit_code", regex: "^0$" }
