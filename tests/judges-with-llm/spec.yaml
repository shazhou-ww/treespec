description: "judges command output with LLM"
env:
  - SILICONFLOW_API_KEY
steps:
  - type: exec
    command: "treespec run --config assets/llm-fixture/treespec.yaml --image treespec-fixture:base --no-mount --no-trace --keep-tags 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 passed" }
        - { path: "exit_code", regex: "^0$" }
