description: "sends HTTP GET and asserts response"
steps:
  - type: exec
    command: "treespec run --config /specs/sends-get-request/assets/http-get-fixture/treespec.yaml --image treespec-fixture:base --no-mount --no-trace --keep-tags 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 passed" }
        - { path: "exit_code", regex: "^0$" }
