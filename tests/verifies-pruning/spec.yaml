description: "verifies pruning when a node fails"
steps:
  - type: exec
    command: "treespec run --config /specs/verifies-pruning/assets/pruning-fixture/treespec.yaml --image treespec-fixture:base --no-mount --no-trace --keep-tags 2>&1; true"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 failed" }
        - { path: "stdout", regex: "1 skipped" }
        - { path: "exit_code", regex: "^0$" }
