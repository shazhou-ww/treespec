description: "read parent state via committed image"
steps:
  - type: exec
    command: "cat /tmp/state"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "parent-data" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "echo child-data >> /tmp/state"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
