description: "writes state via docker commit for children to inherit"
steps:
  - type: exec
    command: "echo parent-data > /tmp/state"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
postcon:
  - name: verify-state-committed
    steps:
      - type: exec
        command: "cat /tmp/state"
        assert:
          type: regex
          conditions:
            - { path: "stdout", regex: "parent-data" }
            - { path: "exit_code", regex: "^0$" }
