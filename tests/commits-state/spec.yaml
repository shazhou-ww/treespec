description: "verifies docker commit chain passes state through tree"
steps:
  - type: exec
    command: "treespec run --config assets/commit-chain-fixture/treespec.yaml --image treespec-fixture:base --no-mount --no-trace --keep-tags 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "4 passed" }
        - { path: "exit_code", regex: "^0$" }
