description: "shows test tree structure with tree command"
steps:
  - type: exec
    command: "treespec tree --config /app/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "base image" }
        - { path: "stdout", regex: "executes-command" }
        - { path: "stdout", regex: "commits-state" }
        - { path: "exit_code", regex: "^0$" }
