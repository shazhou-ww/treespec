description: "init a treespec project and install SUT (greet CLI)"
steps:
  - type: exec
    command: "rm -rf /workspace/bootstrap-project && treespec init /workspace/bootstrap-project --name bootstrap 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Created treespec project" }
        - { path: "stdout", regex: "bootstrap" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "cp -r /app/spec/assets/sut /workspace/bootstrap-project/sut && cp /app/spec/assets/project-package.json /workspace/bootstrap-project/package.json"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "cd /workspace/bootstrap-project && npm install 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "test -f /workspace/bootstrap-project/treespec.yaml && test -f /workspace/bootstrap-project/spec/Dockerfile && test -f /workspace/bootstrap-project/node_modules/.bin/greet && echo ok"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "ok" }
        - { path: "exit_code", regex: "^0$" }
primary: add-specs
branches:
  - add-bad-spec
  - add-commit-chain
  - add-llm-spec
  - add-pruning
  - add-primary-branches
  - add-wait
  - validate-fresh
