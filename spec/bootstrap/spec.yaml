description: "init a treespec project and prepare Dockerfile for DinD"
steps:
  - type: exec
    command: "rm -rf /tmp/bootstrap-project && treespec init /tmp/bootstrap-project --name bootstrap 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Created treespec project" }
        - { path: "stdout", regex: "bootstrap" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "printf 'FROM node:22-alpine\\nCOPY . /tmp/bootstrap-project\\n' > /tmp/bootstrap-project/spec/Dockerfile"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "test -f /tmp/bootstrap-project/treespec.yaml && test -f /tmp/bootstrap-project/spec/Dockerfile && test -f /tmp/bootstrap-project/spec/example/spec.yaml && echo ok"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "ok" }
        - { path: "exit_code", regex: "^0$" }

primary: add-specs
branches:
  - add-bad-spec
  - add-commit-chain
  - add-llm-spec
  - add-pruning
  - add-primary-branches
  - add-wait
  - validate-fresh
