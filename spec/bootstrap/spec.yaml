description: "init a treespec project and install SUT (greet CLI)"
steps:
  - type: exec
    description: "create project dir"
    command: "rm -rf /workspace/greeting && mkdir -p /workspace/greeting"
  - type: exec
    description: "copy SUT (greet CLI) into project"
    command: "cp -r /app/spec/assets/sut /workspace/greeting/sut"
  - type: exec
    description: "link greet to node_modules/.bin (PATH entry)"
    command: "chmod +x /workspace/greeting/sut/src/index.js && mkdir -p /workspace/greeting/node_modules/.bin && ln -sf ../../sut/src/index.js /workspace/greeting/node_modules/.bin/greet"
  - type: exec
    description: "init treespec in existing project"
    command: "treespec init /workspace/greeting --name greeting 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Created treespec project" }
        - { path: "stdout", regex: "greeting" }
postcon:
  - name: verify-setup
    steps:
      - type: exec
        description: "verify project setup in committed state"
        command: |
          test -f /workspace/greeting/treespec.yaml &&
          test -f /workspace/greeting/spec/Dockerfile &&
          test -x /workspace/greeting/node_modules/.bin/greet &&
          echo ok
        assert:
          type: regex
          conditions:
            - { path: "stdout", regex: "ok" }
primary: add-specs
branches:
  - add-bad-spec
  - add-commit-chain
  - add-llm-spec
  - add-pruning
  - add-primary-branches
  - add-wait
  - validate-fresh
