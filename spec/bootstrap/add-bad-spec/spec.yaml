description: "add a spec with invalid assertion type"
steps:
  - type: exec
    command: |
      mkdir -p /tmp/bootstrap-project/spec/broken-spec
      cat > /tmp/bootstrap-project/spec/broken-spec/spec.yaml << 'SPEC'
      description: "broken spec with invalid assert"
      steps:
        - type: exec
          command: "echo hi"
          assert:
            type: nonexistent
            conditions:
              - { path: "stdout", regex: "hi" }
      SPEC
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }

primary: validate-rejects
