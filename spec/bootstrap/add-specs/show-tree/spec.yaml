description: "show tree after specs are added"
steps:
  - type: exec
    command: "treespec tree --config /workspace/bootstrap-project/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "greet" }
        - { path: "stdout", regex: "with-name" }
        - { path: "stdout", regex: "no-name" }
        - { path: "stdout", regex: "http" }
        - { path: "stdout", regex: "get-ok" }
        - { path: "stdout", regex: "get-fail" }
        - { path: "exit_code", regex: "^0$" }
