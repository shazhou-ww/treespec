description: "show tree after specs are added"
steps:
  - type: exec
    command: "treespec tree --config /workspace/bootstrap-project/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "greet" }
        - { path: "stdout", regex: "init" }
        - { path: "stdout", regex: "configure" }
        - { path: "stdout", regex: "verify" }
        - { path: "stdout", regex: "set-empty" }
        - { path: "stdout", regex: "serve" }
        - { path: "exit_code", regex: "^0$" }
