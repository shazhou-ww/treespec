description: "show full spec forest"
steps:
  - type: exec
    description: "show tree"
    command: "treespec tree --config /workspace/greeting/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "greet" }
        - { path: "stdout", regex: "write-state" }
        - { path: "stdout", regex: "prune-parent" }
        - { path: "stdout", regex: "primary-demo" }
