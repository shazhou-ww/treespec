description: "validate should warn about orphan child"
steps:
  - description: "validate — expect orphan warning"
    command: "treespec validate --config /workspace/greeting/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "orphan-child" }
        - { path: "stdout", regex: "not declared" }
