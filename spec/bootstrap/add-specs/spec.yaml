description: "add greet spec tree with state-dependent structure"
steps:
  - type: exec
    description: "copy greet spec tree into project"
    command: "cp -r /app/spec/assets/spec/greet /workspace/greeting/spec/greet"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
primary: run-all
branches:
  - run-subset
  - run-with-keep-tags
  - run-with-trace
  - show-tree
  - show-lineage
  - validate-passes
