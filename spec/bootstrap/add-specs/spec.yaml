description: "add passing and failing specs (exec + http step types)"
steps:
  - type: exec
    command: "cp -r /app/spec/assets/specs/greet /workspace/bootstrap-project/spec/greet && cp -r /app/spec/assets/specs/http /workspace/bootstrap-project/spec/http"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
primary: run-all
branches:
  - run-subset
  - run-with-keep-tags
  - run-with-trace
  - show-tree
  - show-lineage
  - validate-passes
