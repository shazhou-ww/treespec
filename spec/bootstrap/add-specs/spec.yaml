description: "add greet spec tree with state-dependent structure"
steps:
  - type: exec
    command: "cp -r /app/spec/assets/specs/greet /workspace/bootstrap-project/spec/greet"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
primary: run-all
branches:
  - run-subset
  - run-with-keep-tags
  - run-with-trace
  - show-tree
  - show-lineage
  - validate-passes
