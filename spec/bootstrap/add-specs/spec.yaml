description: "copy all good spec trees into project at once"
steps:
  - description: "copy greet, write-state, llm-assert, prune-parent, wait-poll, primary-demo"
    command: |
      cp -r /app/spec/assets/spec/greet /workspace/greeting/spec/ &&
      cp -r /app/spec/assets/spec/write-state /workspace/greeting/spec/ &&
      cp -r /app/spec/assets/spec/llm-assert /workspace/greeting/spec/ &&
      cp -r /app/spec/assets/spec/prune-parent /workspace/greeting/spec/ &&
      cp -r /app/spec/assets/spec/wait-poll /workspace/greeting/spec/ &&
      cp -r /app/spec/assets/spec/primary-demo /workspace/greeting/spec/
primary: validate
branches:
  - run-all
  - show-tree
  - show-lineage
  - run-subset
  - run-with-keep-tags
  - run-with-trace
  - add-warning-demo
  - add-bad-spec
  - add-no-primary
