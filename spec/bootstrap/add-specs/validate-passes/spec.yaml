description: "validate after adding all specs"
steps:
  - type: exec
    description: "validate should pass"
    command: "treespec validate --config /workspace/greeting/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Valid" }
        - { path: "stdout", regex: "greet" }
        - { path: "stdout", regex: "configure" }
