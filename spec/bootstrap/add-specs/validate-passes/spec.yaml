description: "validate after adding all specs"
steps:
  - type: exec
    command: "treespec validate --config /workspace/bootstrap-project/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Valid" }
        - { path: "stdout", regex: "greet" }
        - { path: "stdout", regex: "configure" }
        - { path: "exit_code", regex: "^0$" }
