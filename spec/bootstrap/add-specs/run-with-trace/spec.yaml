description: "run with trace enabled, then show it"
steps:
  - type: exec
    command: "rm -rf /workspace/bootstrap-trace && treespec run --config /workspace/bootstrap-project/treespec.yaml --rebuild --output /workspace/bootstrap-trace/trace.jsonl 2>&1; true"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Trace" }
        - { path: "stdout", regex: "bootstrap-trace" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "test -f /workspace/bootstrap-trace/trace.jsonl && treespec show /workspace/bootstrap-trace/trace.jsonl 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "PASS" }
        - { path: "stdout", regex: "FAIL" }
        - { path: "exit_code", regex: "^0$" }
