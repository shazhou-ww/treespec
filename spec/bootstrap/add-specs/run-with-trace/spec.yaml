description: "run with trace enabled, then show it"
steps:
  - type: exec
    description: "run with trace output"
    command: "rm -rf /workspace/greeting-trace && treespec run --config /workspace/greeting/treespec.yaml --rebuild --output /workspace/greeting-trace/trace.jsonl 2>&1; true"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Trace" }
        - { path: "stdout", regex: "greeting-trace" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    description: "verify trace file and show"
    command: "test -f /workspace/greeting-trace/trace.jsonl && treespec show /workspace/greeting-trace/trace.jsonl 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "PASS" }
        - { path: "stdout", regex: "FAIL" }
        - { path: "exit_code", regex: "^0$" }
