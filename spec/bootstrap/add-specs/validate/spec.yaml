description: "validate project with all specs"
steps:
  - description: "validate all specs"
    command: "treespec validate --config /workspace/greeting/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Valid" }
        - { path: "stdout", regex: "greet" }
        - { path: "stdout", regex: "write-state" }
        - { path: "stdout", regex: "primary-demo" }
