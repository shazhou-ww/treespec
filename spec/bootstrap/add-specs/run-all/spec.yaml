description: "run all specs — expect failures (prune-parent, set-empty) and skips"
steps:
  - description: "run all specs"
    timeout: "5m"
    command: "treespec run --config /workspace/greeting/treespec.yaml --no-trace --rebuild 2>&1; true"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "passed" }
        - { path: "stdout", regex: "failed" }
        - { path: "stdout", regex: "prune-parent" }
