description: "run all specs — expect 6 passed and 1 failed"
steps:
  - type: exec
    description: "run all greet specs"
    command: "treespec run --config /workspace/greeting/treespec.yaml --no-trace --rebuild 2>&1; true"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "6 passed" }
        - { path: "stdout", regex: "1 failed" }
