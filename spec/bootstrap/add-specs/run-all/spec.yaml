description: "run all specs — expect 6 passed and 1 failed"
steps:
  - type: exec
    command: "treespec run --config /workspace/bootstrap-project/treespec.yaml --no-trace --rebuild 2>&1; true"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "6 passed" }
        - { path: "stdout", regex: "1 failed" }
        - { path: "exit_code", regex: "^0$" }
