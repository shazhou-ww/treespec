description: "run a single spec by path"
steps:
  - type: exec
    command: "treespec run --config /workspace/bootstrap-project/treespec.yaml greet/with-name --no-trace 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "2 passed" }
        - { path: "exit_code", regex: "^0$" }
