description: "run a single spec by path"
steps:
  - type: exec
    command: "treespec run --config /tmp/bootstrap-project/treespec.yaml echo-hello --no-mount --no-trace 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 passed" }
        - { path: "exit_code", regex: "^0$" }
