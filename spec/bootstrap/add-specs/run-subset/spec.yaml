description: "run a single spec by path"
steps:
  - description: "run single spec — greet/init/configure/verify"
    command: "treespec run --config /workspace/greeting/treespec.yaml greet/init/configure/verify --no-trace 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "4 passed" }
