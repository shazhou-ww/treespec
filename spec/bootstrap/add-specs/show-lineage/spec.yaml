description: "show lineage of the primary path"
steps:
  - description: "show full lineage"
    command: "treespec lineage --config /app/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "bootstrap" }
        - { path: "stdout", regex: "add-specs" }
        - { path: "stdout", regex: "validate" }
  - description: "show ancestors only"
    command: "treespec lineage bootstrap/add-specs --config /app/treespec.yaml --only-ancestors 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "← here" }
        - { path: "stdout", regex: "bootstrap" }
  - description: "show descendants only"
    command: "treespec lineage bootstrap/add-specs --config /app/treespec.yaml --only-descends 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "validate" }
