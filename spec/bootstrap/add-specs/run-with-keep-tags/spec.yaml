description: "run with --keep-tags to leave ephemeral tags"
steps:
  - type: exec
    description: "run single spec with --keep-tags"
    command: "treespec run --config /workspace/greeting/treespec.yaml greet/init/configure/verify --no-trace --keep-tags 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "4 passed" }
