description: "run with --keep-tags to leave ephemeral tags"
steps:
  - type: exec
    command: "treespec run --config /workspace/bootstrap-project/treespec.yaml greet/init/configure/verify --no-trace --keep-tags 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "4 passed" }
        - { path: "exit_code", regex: "^0$" }
