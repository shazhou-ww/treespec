description: "verify error when branches declared without primary"
steps:
  - type: exec
    description: "copy no-primary-demo spec into project"
    command: "cp -r /app/spec/assets/spec/no-primary-demo /workspace/greeting/spec/"
  - type: exec
    description: "validate — expect error about missing primary"
    command: |
      treespec validate --config /workspace/greeting/treespec.yaml 2>&1;
      [ $? -ne 0 ]
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "primary" }
