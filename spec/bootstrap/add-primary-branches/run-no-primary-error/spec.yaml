description: "verify error when branches declared without primary"
steps:
  - type: exec
    description: "add no-primary-demo and validate — expect error"
    command: "cp -r /app/spec/assets/spec/no-primary-demo /workspace/greeting/spec/no-primary-demo && treespec validate --config /workspace/greeting/treespec.yaml 2>&1; [ $? -ne 0 ]"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "primary" }
        - { path: "exit_code", regex: "^0$" }
