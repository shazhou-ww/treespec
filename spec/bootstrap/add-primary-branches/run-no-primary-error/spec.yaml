description: "verify error when branches declared without primary"
steps:
  - type: exec
    command: |
      mkdir -p /tmp/bootstrap-project/spec/no-primary-demo/child-a
      cat > /tmp/bootstrap-project/spec/no-primary-demo/spec.yaml << 'SPEC'
      description: "branches without primary"
      steps:
        - type: exec
          command: "echo no-primary"
      branches:
        - child-a
      SPEC
      cat > /tmp/bootstrap-project/spec/no-primary-demo/child-a/spec.yaml << 'SPEC'
      description: "child a"
      steps:
        - type: exec
          command: "echo child-a"
      SPEC
      treespec validate --config /tmp/bootstrap-project/treespec.yaml 2>&1; [ $? -ne 0 ]
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "primary" }
        - { path: "exit_code", regex: "^0$" }
