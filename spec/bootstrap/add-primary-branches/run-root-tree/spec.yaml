description: "verify root spec.yaml creates a single tree (Roots: 1)"
steps:
  - type: exec
    command: "rm -rf /workspace/root-tree-test && treespec init /workspace/root-tree-test --name root-tree-test 2>&1 && cp /app/spec/assets/spec/root-spec/spec.yaml /workspace/root-tree-test/spec/spec.yaml"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "treespec validate --config /workspace/root-tree-test/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Roots: 1" }
        - { path: "stdout", regex: "root" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "treespec tree --config /workspace/root-tree-test/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "root" }
        - { path: "stdout", regex: "example" }
        - { path: "exit_code", regex: "^0$" }
