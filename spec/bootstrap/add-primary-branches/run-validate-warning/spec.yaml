description: "verify warning for spec.yaml subdir not declared in primary/branches"
steps:
  - type: exec
    description: "add warning-demo and validate — expect warning"
    command: "cp -r /app/spec/assets/spec/warning-demo /workspace/bootstrap-project/spec/warning-demo && treespec validate --config /workspace/bootstrap-project/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "orphan-child" }
        - { path: "stdout", regex: "not declared" }
        - { path: "exit_code", regex: "^0$" }
