description: "verify warning for spec.yaml subdir not declared in primary/branches"
steps:
  - type: exec
    description: "copy warning-demo spec into project"
    command: "cp -r /app/spec/assets/spec/warning-demo /workspace/greeting/spec/warning-demo"
  - type: exec
    description: "validate — expect warning about orphan child"
    command: "treespec validate --config /workspace/greeting/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "orphan-child" }
        - { path: "stdout", regex: "not declared" }
