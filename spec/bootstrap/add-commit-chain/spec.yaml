description: "add commit chain specs — parent writes, child reads"
steps:
  - type: exec
    command: |
      mkdir -p /workspace/bootstrap-project/spec/write-state/read-state
      cat > /workspace/bootstrap-project/spec/write-state/spec.yaml << 'SPEC'
      description: "write state for children to inherit"
      steps:
        - type: exec
          command: "echo parent-data > /tmp/chain-state"
          assert:
            type: regex
            conditions:
              - { path: "exit_code", regex: "^0$" }
      postcon:
        - name: verify-state-committed
          steps:
            - type: exec
              command: "cat /tmp/chain-state"
              assert:
                type: regex
                conditions:
                  - { path: "stdout", regex: "parent-data" }
      primary: read-state
      SPEC
      cat > /workspace/bootstrap-project/spec/write-state/read-state/spec.yaml << 'SPEC'
      description: "read parent committed state"
      steps:
        - type: exec
          command: "cat /tmp/chain-state"
          assert:
            type: regex
            conditions:
              - { path: "stdout", regex: "parent-data" }
      SPEC
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }

primary: run-commit-chain
