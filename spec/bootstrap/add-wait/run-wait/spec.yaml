description: "run wait spec — expect 1 passed"
steps:
  - type: exec
    command: "treespec run --config /tmp/bootstrap-project/treespec.yaml wait-poll --no-trace --rebuild 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 passed" }
        - { path: "exit_code", regex: "^0$" }
