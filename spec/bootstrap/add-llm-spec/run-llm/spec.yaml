description: "run llm assert spec — expect 1 passed"
env:
  - TREESPEC_LLM_API_KEY
steps:
  - type: exec
    description: "run llm-assert spec"
    command: "treespec run --config /workspace/greeting/treespec.yaml llm-assert --no-trace --rebuild 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 passed" }
        - { path: "exit_code", regex: "^0$" }
