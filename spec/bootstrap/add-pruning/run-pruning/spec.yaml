description: "run pruning fixture — expect 1 failed, 1 skipped"
steps:
  - type: exec
    description: "run prune-parent spec"
    command: "treespec run --config /workspace/greeting/treespec.yaml prune-parent --no-trace --rebuild 2>&1; true"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "1 failed" }
        - { path: "stdout", regex: "1 skipped" }
        - { path: "exit_code", regex: "^0$" }
