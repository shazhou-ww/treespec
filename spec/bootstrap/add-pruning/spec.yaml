description: "add pruning fixture — parent fails, child should skip"
steps:
  - type: exec
    command: "cp -r /app/spec/assets/spec/prune-parent /workspace/bootstrap-project/spec/prune-parent"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
primary: run-pruning
