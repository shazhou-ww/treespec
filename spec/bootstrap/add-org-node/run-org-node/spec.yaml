description: "run org node — expect 2 passed (org passthrough + child)"
steps:
  - type: exec
    command: "treespec run --config /tmp/bootstrap-project/treespec.yaml org-group --no-mount --no-trace --rebuild 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "2 passed" }
        - { path: "exit_code", regex: "^0$" }
