description: "add org node structure — group without spec.yaml"
steps:
  - type: exec
    command: |
      mkdir -p /tmp/bootstrap-project/spec/org-group/inner
      cat > /tmp/bootstrap-project/spec/org-group/inner/spec.yaml << 'SPEC'
      description: "child under org group"
      steps:
        - type: exec
          command: "echo from-child"
          assert:
            type: regex
            conditions:
              - { path: "stdout", regex: "from-child" }
      SPEC
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
