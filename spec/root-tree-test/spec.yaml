description: "verify root spec.yaml creates a single tree (Roots: 1)"
steps:
  - description: "init root-tree-test project"
    command: |
      rm -rf /workspace/root-tree-test &&
      treespec init /workspace/root-tree-test --name root-tree-test 2>&1
  - description: "copy root spec.yaml into project"
    command: "cp /app/spec/assets/spec/root-spec/spec.yaml /workspace/root-tree-test/spec/spec.yaml"
  - description: "validate empty project"
    command: "treespec validate --config /workspace/root-tree-test/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Roots: 1" }
        - { path: "stdout", regex: "root" }
  - description: "show tree of empty project"
    command: "treespec tree --config /workspace/root-tree-test/treespec.yaml 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "root" }
        - { path: "stdout", regex: "example" }
