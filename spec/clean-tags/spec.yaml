description: "init project, run parent-child with --keep-tags, then clean removes tags"
steps:
  - type: exec
    command: "rm -rf /workspace/clean-test && treespec init /workspace/clean-test --name clean-test 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Created treespec project" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "cp -r /app/spec/assets/spec/clean-parent /workspace/clean-test/spec/parent"
    assert:
      type: regex
      conditions:
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "treespec run --config /workspace/clean-test/treespec.yaml parent --keep-tags --rebuild 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "2 passed" }
        - { path: "exit_code", regex: "^0$" }
  - type: exec
    command: "treespec clean 2>&1"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Removed" }
        - { path: "exit_code", regex: "^0$" }
