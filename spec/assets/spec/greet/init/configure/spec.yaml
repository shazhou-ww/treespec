description: "greet config set name Alice — update state"
steps:
  - type: exec
    command: "greet config set name Alice"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "name=Alice" }
        - { path: "exit_code", regex: "^0$" }
primary: verify
branches:
  - set-empty
  - serve
