description: "write state for children to inherit"
steps:
  - type: exec
    command: "echo parent-data > /tmp/chain-state"
postcon:
  - name: verify-state-committed
    steps:
      - type: exec
        command: "cat /tmp/chain-state"
        assert:
          type: regex
          conditions:
            - { path: "stdout", regex: "parent-data" }
primary: read-state
